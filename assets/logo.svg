<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3f2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 耳机头梁 -->
  <path d="M68 120 Q70 64 128 58 Q186 64 188 120" stroke="#1a1a2e" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#soft)"/>
  <!-- 耳机左耳罩 -->
  <ellipse cx="64" cy="128" rx="16" ry="20" fill="#1a1a2e" filter="url(#soft)"/>
  <ellipse cx="64" cy="128" rx="9" ry="12" fill="#4f46e5"/>
  <!-- 耳机右耳罩 -->
  <ellipse cx="192" cy="128" rx="16" ry="20" fill="#1a1a2e" filter="url(#soft)"/>
  <ellipse cx="192" cy="128" rx="9" ry="12" fill="#4f46e5"/>

  <!-- 小兔耳朵（一正一歪）-->
  <g transform="translate(0,-2)">
    <!-- 左耳 -->
    <ellipse cx="102" cy="82" rx="13" ry="32" fill="url(#ear)" stroke="#d4c0a8" stroke-width="2"/>
    <ellipse cx="102" cy="86" rx="6" ry="18" fill="#ffc0cb"/>
    <!-- 右耳（歪的，表示偷听）-->
    <ellipse cx="154" cy="82" rx="13" ry="32" fill="url(#ear)" stroke="#d4c0a8" stroke-width="2" transform="rotate(14 154 82)"/>
    <ellipse cx="154" cy="86" rx="6" ry="18" fill="#ffc0cb" transform="rotate(14 154 86)"/>
  </g>

  <!-- 兔脸 -->
  <ellipse cx="128" cy="162" rx="52" ry="48" fill="#ffffff" stroke="#d4c0a8" stroke-width="2.5"/>
  <!-- 腮红 -->
  <circle cx="96" cy="170" r="8" fill="#ffd0d0" opacity=".7"/>
  <circle cx="160" cy="170" r="8" fill="#ffd0d0" opacity=".7"/>

  <!-- 眼睛（眯眯偷听）-->
  <path d="M104 158 Q112 150 120 158" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M136 158 Q144 150 152 158" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 鼻子 -->
  <ellipse cx="128" cy="174" rx="5" ry="3.5" fill="#ff9fb0"/>

  <!-- 嘴 -->
  <path d="M128 177 Q123 184 119 182" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M128 177 Q133 184 137 182" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 字幕气泡 -->
  <g transform="translate(128,222)">
    <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#ffffff" opacity=".95"/>
    <rect x="-38" y="-10" width="20" height="3" rx="1.5" fill="#6366f1"/>
    <rect x="-38" y="-4" width="42" height="3" rx="1.5" fill="#8b5cf6"/>
    <rect x="-38" y="2" width="14" height="3" rx="1.5" fill="#6366f1"/>
    <!-- 气泡尾巴 -->
    <path d="M-8 16 L-14 24 L-2 16 Z" fill="#ffffff" opacity=".95"/>
  </g>
</svg>
