<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf3ea">
<title>📘 笔记</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#faf3ea;color:#2a2a2a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.container{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}

/* ===== 伪装：顶部像个笔记 App ===== */
.topbar{display:flex;align-items:center;gap:6px;padding:8px 2px 4px}
.app-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#f4a261,#e76f51);display:flex;align-items:center;justify-content:center;font-size:16px}
.app-title{font-size:15px;font-weight:600;flex:1;color:#444}
.status-dot{width:8px;height:8px;border-radius:50%;background:#ddd;flex-shrink:0}
.status-dot.on{background:#a3d9a5;box-shadow:0 0 5px #a3d9a5}
.icon-btn{width:28px;height:28px;border-radius:7px;border:none;background:rgba(0,0,0,.05);color:#888;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.icon-btn:active{background:rgba(0,0,0,.12)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .badge{position:absolute;top:-2px;right:-2px;background:#e76f51;font-size:9px;padding:0 4px;border-radius:7px;min-width:11px;height:11px;line-height:11px;text-align:center;color:#fff}
.icon-btn.lang-open{background:rgba(99,102,241,.1);color:#6366f1}

/* 语言面板（弹出式，默认隐藏）*/
.lang-panel{display:none;padding:8px;background:rgba(0,0,0,.03);border-radius:10px;margin-bottom:6px;gap:6px;flex-wrap:wrap}
.lang-panel.show{display:flex}
.lang-chip{padding:6px 10px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:#fff;font-size:12px;color:#555;cursor:pointer}
.lang-chip.active{background:#6366f1;border-color:#6366f1;color:#fff}

/* ===== 字幕区 ===== */
.subtitle-area{flex:1;display:flex;flex-direction:column;gap:6px;padding:4px 0;min-height:0}

/* 译文：主力，占最大空间 */
.translated{flex:1;text-align:left;color:#1a1a2e;font-size:22px;font-weight:600;line-height:1.55;padding:14px 18px;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-y:auto;word-break:break-all}
.translated.empty{color:#bbb;font-weight:400;font-size:14.5px;font-style:italic;display:flex;align-items:center;justify-content:center}
.translated.error{color:#e76f51;font-weight:500}
.translated::-webkit-scrollbar{width:3px}
.translated::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px}

/* 原文：低调折叠 */
.original-wrap{position:relative;max-height:46px;overflow:hidden;border-radius:10px;transition:max-height .3s ease}
.original-wrap.expanded{max-height:260px}
.original{color:#999;font-size:13.5px;line-height:1.5;padding:10px 14px;background:rgba(0,0,0,.02);word-break:break-all}
.original.placeholder{color:#ccc;font-size:12px;font-style:italic;display:flex;align-items:center;justify-content:center;height:46px;padding:0}
.original-wrap .collapse-hint{position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(transparent, rgba(250,243,234,.95));display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;font-size:10px;color:#aaa;cursor:pointer}
.original-wrap.expanded .collapse-hint{background:transparent}
.original-wrap.expanded .collapse-hint span::before{content:"▲ 收起原文"}
.original-wrap:not(.expanded) .collapse-hint span::before{content:"▼ 展开原文"}

/* 隐藏原文模式 */
body.hide-original .original-wrap{display:none}
body.hide-original .translated{flex:1}

/* ===== 底部：小兔/小熊按钮 ===== */
.controls{display:flex;justify-content:center;align-items:center;padding:8px 0 6px}

/* 默认：小兔（待机/听）——耳朵垂下 */
.creature-btn{width:48px;height:48px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden}
.creature-btn:active{transform:scale(.92)}

.creature-btn svg{width:40px;height:40px;display:block}

/* 音量环（已废弃，改成小兔形态）*/
.vol-ring{display:none}
.vol-label{display:none}

/* 状态 1：小兔默认（未录音）*/
.creature-btn .bunny-default{display:block}
.creature-btn .bunny-hiding{display:none}
.creature-btn .bear-listening{display:none}

/* 状态 2：小兔偷听中（表情随音量变）*/
.creature-btn.recording .bunny-default{display:none}
.creature-btn.recording .bunny-hiding{display:block}

/* 状态 3：小熊偷听中（长按切换）*/
.creature-btn.hidden-mode .bunny-default{display:none}
.creature-btn.hidden-mode .bunny-hiding{display:none}
.creature-btn.hidden-mode .bear-listening{display:block}

/* 呼吸动画（录音时）*/
.creature-btn.recording,.creature-btn.hidden-mode{box-shadow:0 2px 14px rgba(163,217,165,.5)}
.creature-btn.hidden-mode .bear-listening .breath{transform-origin:center;animation:breath 2.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ===== 小兔音量形态（核心）===== */
/* 默认（没声音时的初始状态）：一只耳朵歪 */
.creature-btn.recording .bunny-hiding .ear-left{transform-origin:bottom center;transform:rotate(-20deg);transition:transform .2s ease}
.creature-btn.recording .bunny-hiding .ear-right{transform-origin:bottom center;transform:rotate(0deg);transition:transform .2s ease}
.creature-btn.recording .bunny-hiding .eye-dot{opacity:0;transition:opacity .15s}
.creature-btn.recording .bunny-hiding .eye-line{opacity:1;stroke-width:1.8}
.creature-btn.recording .bunny-hiding .face{transition:transform .2s ease}
.creature-btn.recording .bunny-hiding .tear{transition:opacity .2s}

/* vol-0 几乎没声音：耳朵都垂下（不想听）*/
.creature-btn.vol-0.recording .bunny-hiding .ear-left{transform:rotate(-45deg)}
.creature-btn.vol-0.recording .bunny-hiding .ear-right{transform:rotate(45deg)}
.creature-btn.vol-0.recording .bunny-hiding .eye-line{stroke-width:2.2}  /* 紧闭 */

/* vol-1 音量弱（远）：一只歪一只半立，眼睛半眯 */
.creature-btn.vol-1.recording .bunny-hiding .ear-left{transform:rotate(-25deg)}
.creature-btn.vol-1.recording .bunny-hiding .ear-right{transform:rotate(15deg)}
.creature-btn.vol-1.recording .bunny-hiding .eye-line{stroke-width:1.8}

/* vol-2 音量中（正常）：两只都竖起来，眼睛正开 */
.creature-btn.vol-2.recording .bunny-hiding .ear-left{transform:rotate(-5deg)}
.creature-btn.vol-2.recording .bunny-hiding .ear-right{transform:rotate(5deg)}
.creature-btn.vol-2.recording .bunny-hiding .eye-line{opacity:.4}  /* 眯眼变平（开了）*/
.creature-btn.vol-2.recording .bunny-hiding .eye-dot{opacity:1}  /* 眼珠出现 */

/* vol-3 音量强（近）：两只完全竖起 + 身体往前探 */
.creature-btn.vol-3.recording .bunny-hiding .ear-left{transform:rotate(0deg)}
.creature-btn.vol-3.recording .bunny-hiding .ear-right{transform:rotate(0deg)}
.creature-btn.vol-3.recording .bunny-hiding .eye-line{opacity:.3}
.creature-btn.vol-3.recording .bunny-hiding .eye-dot{opacity:1}
.creature-btn.vol-3.recording .bunny-hiding .face{transform:translateY(-1px) scale(1.04)}

/* vol-4 音量很强（太近）：耳朵往后贴 + 身体缩 + 掉眼泪 */
.creature-btn.vol-4.recording .bunny-hiding .ear-left{transform:rotate(-60deg)}
.creature-btn.vol-4.recording .bunny-hiding .ear-right{transform:rotate(60deg)}
.creature-btn.vol-4.recording .bunny-hiding .eye-line{opacity:.1}  /* 几乎睁眼 */
.creature-btn.vol-4.recording .bunny-hiding .eye-dot{opacity:1}
.creature-btn.vol-4.recording .bunny-hiding .face{transform:translateY(1px) scale(0.96)}
.creature-btn.vol-4.recording .bunny-hiding .tear{opacity:.8}

/* 长按提示（隐藏模式）*/
.long-press-hint{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:6px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200}

/* ===== 历史面板 ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:none;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px}
.modal.show{display:flex}
.modal-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.modal-title{font-size:15px;font-weight:600;flex:1;color:#fff}
.modal-close{width:28px;height:28px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:10px}
.modal-footer{padding:10px;display:flex;gap:8px}

.record{background:rgba(255,255,255,.04);border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.record-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.record-name{flex:1;font-size:13px;font-weight:600;cursor:pointer;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid transparent;color:#fff}
.record-name.editing{border-color:#6366f1;background:#1e1b4b}
.record-meta{font-size:10px;color:rgba(255,255,255,.3)}
.record-text{color:rgba(255,255,255,.8);font-size:13px;line-height:1.5;padding:6px;background:rgba(0,0,0,.2);border-radius:6px;margin-bottom:4px;word-break:break-all}
.record-trans{color:#7dd3fc;font-size:14px;font-weight:600;line-height:1.4;padding:6px;background:rgba(125,211,252,.06);border-radius:6px;word-break:break-all}
.record-actions{display:flex;gap:5px;margin-top:6px}
.record-actions button{flex:1;padding:5px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:11px;cursor:pointer}
.record-actions button.delete{border-color:rgba(239,68,68,.25);color:#f87171}
.empty{text-align:center;color:rgba(255,255,255,.3);padding:50px 20px;font-size:13px}

.btn-primary{flex:1;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-danger{padding:10px;border-radius:8px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.1);color:#f87171;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="app-icon" id="appIcon" title="实时字幕翻译">
      <img src="assets/logo.svg" alt="logo" style="width:100%;height:100%;border-radius:7px;display:block">
    </div>
    <div class="app-title">笔记</div>
    <div class="status-dot" id="statusDot"></div>
    <button class="icon-btn" id="langToggle" title="语言">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
    </button>
    <button class="icon-btn" id="hideOrigToggle" title="隐藏原文">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon-btn" id="studyBtn" title="学习资料">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </button>
    <button class="icon-btn" id="historyBtn" title="历史">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="badge" id="historyCount" style="display:none">0</span>
    </button>
  </div>

  <div class="lang-panel" id="langPanel">
    <button class="lang-chip" data-lang="lebanon">黎巴嫩</button>
    <button class="lang-chip" data-lang="philippines">菲律宾</button>
    <button class="lang-chip" data-lang="bangladesh">孟加拉</button>
    <button class="lang-chip" data-lang="korea">韩国</button>
    <button class="lang-chip active" data-lang="english">英语</button>
  </div>

  <div class="subtitle-area">
    <div class="original-wrap" id="origWrap">
      <div class="original placeholder" id="original">（原文）</div>
      <div class="collapse-hint" id="collapseHint" style="display:none"><span></span></div>
    </div>
    <div class="translated empty" id="translated">译文将在这里出现</div>
  </div>

  <div class="controls">
    <button class="creature-btn" id="micBtn" title="点我开始">
      <!-- 小兔：默认（待机）-->
      <svg class="bunny-default" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="17" cy="10" rx="4" ry="9" fill="#fff" stroke="#d4c0a8" stroke-width="1.5"/>
        <ellipse cx="31" cy="10" rx="4" ry="9" fill="#fff" stroke="#d4c0a8" stroke-width="1.5"/>
        <ellipse cx="17" cy="11" rx="2" ry="5" fill="#ffc0cb"/>
        <ellipse cx="31" cy="11" rx="2" ry="5" fill="#ffc0cb"/>
        <ellipse cx="24" cy="30" rx="13" ry="12" fill="#fff" stroke="#d4c0a8" stroke-width="1.5"/>
        <circle cx="20" cy="28" r="1.8" fill="#333"/>
        <circle cx="28" cy="28" r="1.8" fill="#333"/>
        <ellipse cx="24" cy="32" rx="1.5" ry="1" fill="#ffb6c1"/>
        <path d="M24 33 Q22 35 21 34" stroke="#999" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M24 33 Q26 35 27 34" stroke="#999" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg>

      <!-- 小兔：偷听中（4 种音量形态由 CSS 控制）-->
      <svg class="bunny-hiding" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <!-- 左耳（transform 由 CSS .vol-X 控制）-->
        <g class="ear-left">
          <ellipse cx="16" cy="9" rx="4" ry="9" fill="#fff" stroke="#d4c0a8" stroke-width="1.5"/>
          <ellipse cx="16" cy="10" rx="2" ry="5" fill="#ffc0cb"/>
        </g>
        <!-- 右耳 -->
        <g class="ear-right">
          <ellipse cx="32" cy="9" rx="4" ry="9" fill="#fff" stroke="#d4c0a8" stroke-width="1.5"/>
          <ellipse cx="32" cy="10" rx="2" ry="5" fill="#ffc0cb"/>
        </g>
        <!-- 脸 -->
        <ellipse class="face" cx="24" cy="30" rx="13" ry="12" fill="#fff5f5" stroke="#d4c0a8" stroke-width="1.5"/>
        <!-- 腮红 -->
        <circle cx="17" cy="32" r="2" fill="#ffd0d0" opacity=".6"/>
        <circle cx="31" cy="32" r="2" fill="#ffd0d0" opacity=".6"/>
        <!-- 左眼（闭眼/半眯/睁大 由 CSS 控制）-->
        <g class="eye-left">
          <path class="eye-line" d="M18 28 Q20 26 22 28" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle class="eye-dot" cx="20" cy="28" r="1.8" fill="#333"/>
        </g>
        <!-- 右眼 -->
        <g class="eye-right">
          <path class="eye-line" d="M26 28 Q28 26 30 28" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle class="eye-dot" cx="28" cy="28" r="1.8" fill="#333"/>
        </g>
        <!-- 鼻子嘴 -->
        <ellipse cx="24" cy="32" rx="1.5" ry="1" fill="#ff9fb0"/>
        <path d="M23 34 L25 34" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 小耳机（识别标记）-->
        <g class="earbud">
          <circle cx="15" cy="22" r="3" fill="none" stroke="#a3d9a5" stroke-width="1.5"/>
          <path d="M15 19 Q12 15 10 18" stroke="#a3d9a5" stroke-width="1.5" fill="none"/>
          <circle cx="10" cy="18" r="1.5" fill="#a3d9a5"/>
        </g>
        <!-- 眼泪（只有太大声才显示）-->
        <circle class="tear" cx="20" cy="31" r="1.2" fill="#87ceeb" opacity="0"/>
      </svg>

      <!-- 小熊：长按切换（戴大耳机）-->
      <svg class="bear-listening" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="5" fill="#8b7355"/>
        <circle cx="34" cy="14" r="5" fill="#8b7355"/>
        <circle cx="14" cy="14" r="2.5" fill="#d4a574"/>
        <circle cx="34" cy="14" r="2.5" fill="#d4a574"/>
        <ellipse class="breath" cx="24" cy="28" rx="14" ry="13" fill="#a0826d"/>
        <ellipse cx="24" cy="31" rx="8" ry="7" fill="#d4a574"/>
        <circle cx="20" cy="27" r="1.8" fill="#333"/>
        <circle cx="28" cy="27" r="1.8" fill="#333"/>
        <ellipse cx="24" cy="31" rx="2" ry="1.5" fill="#333"/>
        <path d="M8 22 Q10 10 24 9 Q38 10 40 22" stroke="#4a5568" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="8" cy="24" rx="3" ry="4" fill="#4a5568"/>
        <ellipse cx="40" cy="24" rx="3" ry="4" fill="#4a5568"/>
        <path d="M6 23 L4 21 M6 24 L3 24 M6 25 L4 27" stroke="#6366f1" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="long-press-hint" id="lpHint">长按 0.5s 切换小熊模式</div>

<!-- 历史面板 -->
<div class="modal" id="historyModal">
  <div class="modal-header">
    <div class="modal-title">翻译历史 <span id="historyTotal" style="color:rgba(255,255,255,.3);font-size:12px;font-weight:400"></span></div>
    <button class="modal-close" id="historyClose">×</button>
  </div>
  <div class="modal-body" id="recordsList"></div>
  <div class="modal-footer">
    <button class="btn-danger" id="clearAllBtn">全部删除</button>
    <button class="btn-primary" id="exportBtn">导出 JSON</button>
  </div>
</div>

<script>
const LANGS = {
  lebanon:     { speech: 'ar-LB',  mm: 'ar' },
  philippines: { speech: 'fil-PH', mm: 'fil' },
  bangladesh:  { speech: 'bn-BD',  mm: 'bn' },
  korea:       { speech: 'ko-KR',  mm: 'ko' },
  english:     { speech: 'en-US',  mm: 'en' },
};
const MAX_QUERY = 480;
let currentLang = 'english';
let finalBuffer = '';
let langPanelOpen = false;

const STORAGE_KEY = 'subtitle_records_v1';
let records = loadRecords();
function loadRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function saveRecords() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch(e){} updateBadge(); }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function makeDefaultName(orig, lang) {
  const label = {lebanon:'黎巴嫩',philippines:'菲律宾',bangladesh:'孟加拉',korea:'韩国',english:'英语'}[lang] || lang;
  const preview = orig.slice(0, 18).replace(/[\n\r]+/g, ' ');
  const date = new Date().toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `${label} ${date} 「${preview}${orig.length>18?'...':''}」`;
}
function addRecord(orig, trans, lang) {
  if (!orig || !orig.trim()) return;
  records.unshift({id: newId(), name: makeDefaultName(orig, lang), original: orig.trim(), translated: (trans||'').trim(), lang, createdAt: Date.now()});
  saveRecords();
}
function deleteRecord(id) { records = records.filter(r => r.id !== id); saveRecords(); renderRecords(); }
function renameRecord(id, n) { const r = records.find(x => x.id === id); if (r){ r.name = n.trim() || r.name; saveRecords(); renderRecords(); } }

function updateBadge() {
  const c = records.length;
  const el = document.getElementById('historyCount');
  if (c > 0) { el.style.display = ''; el.textContent = c; } else { el.style.display = 'none'; }
}

// ===== UI =====
const originalEl = document.getElementById('original');
const origWrap = document.getElementById('origWrap');
const translatedEl = document.getElementById('translated');
const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const langToggle = document.getElementById('langToggle');
const langPanel = document.getElementById('langPanel');
const hideOrigToggle = document.getElementById('hideOrigToggle');
const historyBtn = document.getElementById('historyBtn');
const historyModal = document.getElementById('historyModal');

function setStatus(on) { statusDot.classList.toggle('on', !!on); }

// ===== 翻译（多后端自动降级 + 本地缓存）=====
let translateToken = 0;
let scheduledTimer = null;
let lastTextHash = '';
let backendIndex = 0;

// 翻译缓存：key = lang+text，value = 译文。localStorage 持久化
const TR_CACHE_KEY = 'tr_cache_v1';
const trCache = loadTrCache();
function loadTrCache() { try { return JSON.parse(localStorage.getItem(TR_CACHE_KEY) || '{}'); } catch { return {}; } }
function saveTrCache() { try { localStorage.setItem(TR_CACHE_KEY, JSON.stringify(trCache)); } catch(e){} }
function cacheKey(lang, text) { return lang + '|' + text.slice(0, 200).toLowerCase(); }

const TRANSLATE_BACKENDS = [
  {
    name: 'Google',
    // Google 网页版用的端点，无 key、浏览器 IP 不会被拦
    translate: async (text, src, tgt) => {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`;
      const resp = await fetch(url, {cache:'no-store', referrer:'https://translate.google.com/'});
      if (!resp.ok) throw new Error('google ' + resp.status);
      const data = await resp.json();
      if (!data || !Array.isArray(data[0])) throw new Error('bad google resp');
      return data[0].map(x => x[0]).join('');
    }
  },
  {
    name: 'MyMemory',
    translate: async (text, src, tgt) => {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}`;
      const resp = await fetch(url, {cache:'no-store'});
      if (!resp.ok) throw new Error('mm ' + resp.status);
      const data = await resp.json();
      const t = data?.responseData?.translatedText || '';
      if (/YOU USED ALL AVAILABLE FREE|quota.exceeded|rate.limit/i.test(t)) throw new Error('mm rate limited');
      if (!t) throw new Error('mm empty');
      return t;
    }
  },
  {
    name: 'Argos',
    translate: async (text, src, tgt) => {
      const instances = [
        'https://translate.argosopentech.com/translate',
      ];
      for (const inst of instances) {
        try {
          const resp = await fetch(inst, {
            method:'POST',
            headers:{'Content-Type':'application/json','Origin':inst},
            body: JSON.stringify({q:text, source:src, target:tgt, format:'text'})
          });
          if (!resp.ok) continue;
          const data = await resp.json();
          if (data?.translatedText) return data.translatedText;
        } catch(e) {}
      }
      throw new Error('argos fail');
    }
  },
];

const LANG_CODE = {
  lebanon:     'ar',
  philippines: 'fil',
  bangladesh:  'bn',
  korea:       'ko',
  english:     'en',
};

async function doTranslate(text) {
  if (!text || !text.trim()) return '';

  // 0. 查缓存（整段）
  const fullKey = cacheKey(currentLang, text);
  if (trCache[fullKey]) return trCache[fullKey];

  const WINDOW = 250;
  const toTranslate = text.length > WINDOW ? text.slice(-WINDOW) : text;
  const segs = [];
  let r = toTranslate.trim();
  while (r.length > MAX_QUERY) {
    let cut = r.slice(0, MAX_QUERY);
    const idx = Math.max(cut.lastIndexOf(' '), cut.lastIndexOf('. '), cut.lastIndexOf('؟'), cut.lastIndexOf('。'));
    const at = idx > MAX_QUERY * 0.6 ? idx : MAX_QUERY;
    segs.push(r.slice(0, at).trim());
    r = r.slice(at).trim();
  }
  if (r) segs.push(r);

  const srcCode = LANG_CODE[currentLang];
  const out = [];
  for (const s of segs) {
    // 段子缓存
    const segKey = cacheKey(currentLang, s);
    if (trCache[segKey]) { out.push(trCache[segKey]); continue; }

    let done = false;
    for (let i = 0; i < TRANSLATE_BACKENDS.length && !done; i++) {
      const idx = (backendIndex + i) % TRANSLATE_BACKENDS.length;
      try {
        const t = await TRANSLATE_BACKENDS[idx].translate(s, srcCode, 'zh-CN');
        if (t) {
          out.push(t);
          backendIndex = idx;
          trCache[segKey] = t;  // 缓存这个段子
          done = true;
        }
      } catch(e) {}
    }
  }
  const result = out.join(' ');
  // 整段也缓存
  if (result) { trCache[fullKey] = result; saveTrCache(); }
  return result;
}
// 快速节流 + token 机制：旧请求回来直接丢
function scheduleTranslate(text) {
  if (!text) return;
  const token = ++translateToken;

  // 文本没变就不重复翻
  const hash = text.slice(-80);
  if (hash === lastTextHash && translatedEl.textContent && !translatedEl.classList.contains('error')) return;
  lastTextHash = hash;

  if (scheduledTimer) clearTimeout(scheduledTimer);
  scheduledTimer = setTimeout(async () => {
    const myToken = token;
    const result = await doTranslate(text);
    // 旧结果 — 直接丢
    if (myToken !== translateToken) return;
    // 显示
    if (result) {
      translatedEl.classList.remove('empty','error');
      translatedEl.textContent = result;
    } else if (translatedEl.textContent === '翻译中...') {
      // 保持旧译文不动
    }
  }, 180);  // 180ms 节流，极快
}

// ===== 原文展开/折叠 =====
let origCollapsed = true;
function updateCollapseHint() {
  // 原文内容够长才显示折叠提示
  if (originalEl.classList.contains('placeholder')) { collapseHint.style.display = 'none'; return; }
  const fullH = originalEl.scrollHeight;
  if (fullH > 50) { collapseHint.style.display = ''; } else { collapseHint.style.display = 'none'; }
}
collapseHint.addEventListener('click', (e) => {
  e.stopPropagation();
  origCollapsed = !origCollapsed;
  origWrap.classList.toggle('expanded', !origCollapsed);
});
originalEl.addEventListener('click', () => {
  if (originalEl.classList.contains('placeholder')) return;
  origCollapsed = !origCollapsed;
  origWrap.classList.toggle('expanded', !origCollapsed);
});

});

  langPanelOpen = !langPanelOpen;
  langPanel.classList.toggle('show', langPanelOpen);

});

    translatedEl.classList.add('empty');
    translatedEl.classList.remove('error');
  });
});

// ===== 音量可视化（小兔形态）=====
let volStream = null, volCtx = null, volAnalyser = null, volData = null, volRAF = null;
const VOL_RING_FG = document.querySelector('.vol-ring .fg');
const MIC_BTN = document.getElementById('micBtn');

async function startVolumeMeter() {
  try {
    volStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    volCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = volCtx.createMediaStreamSource(volStream);
    volAnalyser = volCtx.createAnalyser();
    volAnalyser.fftSize = 256;
    src.connect(volAnalyser);
    volData = new Uint8Array(volAnalyser.frequencyBinCount);
    const tick = () => {
      if (!volAnalyser) return;
      volAnalyser.getByteFrequencyData(volData);
      let sum = 0;
      for (let i = 0; i < volData.length; i++) sum += volData[i] * volData[i];
      const rms = Math.sqrt(sum / volData.length);
      const norm = Math.min(1, rms / 80);

      // 映射到 0-4 档，给 micBtn 加 class
      let level = 0;
      if (norm < 0.08) level = 0;
      else if (norm < 0.25) level = 1;
      else if (norm < 0.5) level = 2;
      else if (norm < 0.8) level = 3;
      else level = 4;

      MIC_BTN.classList.remove('vol-0','vol-1','vol-2','vol-3','vol-4');
      MIC_BTN.classList.add('vol-' + level);

      volRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch(e) {
    console.warn('音量计启动失败（iOS Safari 可能不允许同时开两个麦克风流）', e);
  }
}
function stopVolumeMeter() {
  if (volRAF) cancelAnimationFrame(volRAF);
  volRAF = null;
  if (volStream) volStream.getTracks().forEach(t => t.stop());
  volStream = null;
  if (volCtx) volCtx.close();
  volCtx = null;
  volAnalyser = null;
  MIC_BTN.classList.remove('vol-0','vol-1','vol-2','vol-3','vol-4');
}

// ===== 识别器 =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let fatalError = false;

function initRecognition() {
  if (!SpeechRecognition) { alert('请用 Chrome（Android）或 Safari（iOS）'); return; }
  recognition = new SpeechRecognition();
  recognition.lang = LANGS[currentLang].speech;
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    fatalError = false;
    micBtn.classList.add('recording');
    setStatus(true);
    originalEl.classList.remove('placeholder');
    startVolumeMeter();
  };
  recognition.onend = () => {
    setStatus(false);
    stopVolumeMeter();
    if (!micBtn.dataset.stop && !fatalError) {
      try { recognition.start(); } catch(e){}
    } else {
      micBtn.classList.remove('recording');
    }
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      fatalError = true;
      micBtn.classList.remove('recording');
      setStatus(false);
      alert('请允许麦克风权限');
    } else if (e.error === 'audio-capture') {
      fatalError = true;
      micBtn.classList.remove('recording');
      setStatus(false);
      alert('没有检测到麦克风');
    }
  };

  recognition.onresult = (event) => {
    let interim = '', finals = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) finals += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (finals) {
      finalBuffer += (finalBuffer ? ' ' : '') + finals.trim();
      // 滑窗：头部长了就切老的存历史
      if (finalBuffer.length > MAX_QUERY) {
        const old = finalBuffer.slice(0, MAX_QUERY * 0.7);
        finalBuffer = finalBuffer.slice(old.length);
        doTranslate(old).then(t => addRecord(old, t, currentLang));
      }
    }
    // ===== 关键：interim 变化也立刻翻 =====
    const full = (finalBuffer + (interim ? ' ' + interim : '')).trim();
    if (full) {
      originalEl.textContent = full;
      updateCollapseHint();
      scheduleTranslate(full);  // final 和 interim 都翻！
    }
  };
}

// ===== 按钮交互：短按=录音，长按=小熊模式 =====
let pressTimer = null;
let longPress = false;
let lastTouchAt = 0;
const LONG_PRESS_MS = 500;

micBtn.addEventListener('touchstart', (e) => {
  longPress = false;
  pressTimer = setTimeout(() => {
    longPress = true;
    micBtn.classList.toggle('hidden-mode');
    lpHint.style.opacity = '1';
    setTimeout(() => lpHint.style.opacity = '0', 1500);
  }, LONG_PRESS_MS);
});
micBtn.addEventListener('touchend', (e) => {
  lastTouchAt = Date.now();
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (longPress) { longPress = false; return; }
  handleBtnClick();
  e.preventDefault();
});
micBtn.addEventListener('mousedown', () => {
  if (Date.now() - lastTouchAt < 800) return;  // 忽略触摸后浏览器补发的鼠标事件
  longPress = false;
  pressTimer = setTimeout(() => {
    longPress = true;
    micBtn.classList.toggle('hidden-mode');
    lpHint.style.opacity = '1';
    setTimeout(() => lpHint.style.opacity = '0', 1500);
  }, LONG_PRESS_MS);
});
micBtn.addEventListener('mouseup', () => {
  if (Date.now() - lastTouchAt < 800) return;
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (longPress) { longPress = false; return; }
  handleBtnClick();
});
micBtn.addEventListener('mouseleave', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });

function handleBtnClick() {
  if (!recognition) { alert('当前浏览器不支持语音识别，请用 iOS Safari 或 Android Chrome 打开'); return; }
  if (micBtn.classList.contains('recording')) {
    micBtn.dataset.stop = '1';
    recognition.stop();
    setTimeout(() => {
      if (finalBuffer) {
        const saved = finalBuffer;
        doTranslate(saved).then(t => addRecord(saved, t, currentLang));
      }
      finalBuffer = '';
      originalEl.textContent = '（原文）';
      originalEl.classList.add('placeholder');
      translatedEl.textContent = '译文将在这里出现';
      translatedEl.classList.add('empty');
      translatedEl.classList.remove('error');
      collapseHint.style.display = 'none';
      origCollapsed = true; origWrap.classList.remove('expanded');
      micBtn.dataset.stop = '';
    }, 600);
  } else {
    finalBuffer = '';
    try {
      recognition.start();
    } catch(e) {
      // 已在运行等状态错误：直接保持录音态
      micBtn.classList.add('recording');
      setStatus(true);
    }
  }
}

// ===== 历史 =====
document.getElementById('studyBtn').addEventListener('click', () => { location.href = 'study.html'; });
historyBtn.addEventListener('click', () => { renderRecords(); historyModal.classList.add('show'); });
historyClose.addEventListener('click', () => historyModal.classList.remove('show'));
historyModal.addEventListener('click', (e) => { if (e.target === historyModal) historyModal.classList.remove('show'); });
clearAllBtn.addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm(`确定全部删除 ${records.length} 条？`)) { records = []; saveRecords(); renderRecords(); }
});
exportBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 19).replace(/[:.]/g,'-');
  a.href = url; a.download = `translations-${ts}.json`; a.click();
  URL.revokeObjectURL(url);
});

function renderRecords() {
  historyTotal.textContent = records.length ? `共 ${records.length} 条` : '';
  if (records.length === 0) { recordsList.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  recordsList.innerHTML = records.map(r => `
    <div class="record" data-id="${r.id}">
      <div class="record-top">
        <div class="record-name" contenteditable="false">${escapeHtml(r.name)}</div>
        <div class="record-meta">${langLabel(r.lang)} ${formatDate(r.createdAt)}</div>
      </div>
      <div class="record-text">${escapeHtml(r.original)}</div>
      <div class="record-trans">${escapeHtml(r.translated || '（译文缺失）')}</div>
      <div class="record-actions">
        <button data-act="copy">复制</button>
        <button data-act="rename">重命名</button>
        <button data-act="delete" class="delete">删除</button>
      </div>
    </div>
  `).join('');
  recordsList.querySelectorAll('.record-actions button').forEach(btn => {
    btn.addEventListener('click', () => {
      const recEl = btn.closest('.record');
      const id = recEl.dataset.id;
      const act = btn.dataset.act;
      const rec = records.find(x => x.id === id); if (!rec) return;
      if (act === 'copy') {
        navigator.clipboard?.writeText(rec.original + '\n' + (rec.translated || ''));
        btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1200);
      } else if (act === 'rename') { startRename(recEl.querySelector('.record-name')); }
      else if (act === 'delete') { if (confirm('确定删除？')) deleteRecord(id); }
    });
  });
  recordsList.querySelectorAll('.record-name').forEach(el => {
    el.addEventListener('dblclick', () => startRename(el));
  });
}
function startRename(el) {
  el.classList.add('editing'); el.contentEditable = 'true'; el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = () => { el.contentEditable='false'; el.classList.remove('editing'); renameRecord(el.closest('.record').dataset.id, el.textContent); };
  el.addEventListener('blur', finish, {once:true});
  el.addEventListener('keydown', (e) => { if (e.key==='Enter'){e.preventDefault();el.blur();} if (e.key==='Escape'){const id=el.closest('.record').dataset.id; el.textContent=records.find(x=>x.id===id)?.name||el.textContent; el.blur();} });
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function langLabel(k){return {lebanon:'黎巴嫩',philippines:'菲律宾',bangladesh:'孟加拉',korea:'韩国',english:'英语'}[k]||k;}
function formatDate(ts){const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

initRecognition();
updateBadge();
